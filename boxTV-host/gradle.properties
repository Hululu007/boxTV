# boxTV-host 复合构建专属 Gradle 配置
# 显式固定构建用 JDK 21（完整 JDK，含 jpackage/jlink）：compose desktop 打包
# （createDistributable/packagePortable）要求运行 Gradle 的 JDK 自带 jpackage，
# 系统环境变量 JAVA_HOME 指向 JDK 11（无 jpackage），会导致 checkRuntime 失败，
# 因此与主构建 gradle.properties 保持一致的 org.gradle.java.home。
# 注意：两处值必须相同，否则主构建与复合构建会因 JVM 不一致无法共用 Daemon。
org.gradle.java.home=C:/Users/34569/.gradle/jdks/eclipse_adoptium-21-amd64-windows.2
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
